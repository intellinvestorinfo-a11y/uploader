<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login complete - Intelligent Investor Uploader</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}
code{display:block;padding:12px;background:#f2f2f2;word-break:break-all;margin:8px 0}</style></head>
<body>
<h1>Login complete</h1>
<p>Copy the whole address of this page (the URL in the address bar) back into the uploader tool. Nothing on this page is sent anywhere.</p>
<p id="status"></p>
<code id="code"></code>
<script>
var p = new URLSearchParams(location.search);
var c = p.get("code"), e = p.get("error");
document.getElementById("status").textContent = e ? ("TikTok returned an error: " + e) : (c ? "Authorization code received:" : "No code found in the address.");
if (c) document.getElementById("code").textContent = c;
</script>
</body></html>
